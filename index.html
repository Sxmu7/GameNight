<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="cardparty">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>cardparty — card drinking games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- LANDING -->
  <div class="screen active" id="screen-landing">
    <div class="langToggle landingLang">
      <button data-lang="de" onclick="setLang('de')">DE</button>
      <button data-lang="en" onclick="setLang('en')">EN</button>
    </div>

    <div class="hero">
      <div class="heroCards">
        <div class="heroCard hc1">♠</div>
        <div class="heroCard hc2">♥</div>
        <div class="heroCard hc3">♣</div>
      </div>
      <h1 class="heroTitle">card<span>party</span>.</h1>
      <p class="heroIntro" id="landingIntro">The digital deck for your next get-together.</p>

      <div class="heroFeatures" id="landingFeatures"></div>

      <button class="ctaBtn" id="landingCta" onclick="enterApp()">Let's go →</button>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen" id="screen-home">
    <div class="topbar">
      <div class="wordmark">
        <h1>card<span>party</span>.</h1>
        <p id="tagline">Minimal card drinking games</p>
      </div>
      <div class="langToggle">
        <button data-lang="de" onclick="setLang('de')">DE</button>
        <button data-lang="en" onclick="setLang('en')">EN</button>
      </div>
    </div>

    <div class="players">
      <div class="section-label" id="playersLabel">Players</div>
      <div class="chips" id="chipList"></div>
      <div class="addrow">
        <input id="playerInput" placeholder="Add a name…" maxlength="14">
        <button onclick="addPlayer()">+</button>
      </div>
    </div>

    <div class="section-label" id="gamesLabel">Games</div>
    <div class="modes" id="modeGrid"></div>

    <div class="rulesLink" onclick="goRules()">📖 <span id="rulesLinkTxt">How to play</span></div>
  </div>

  <!-- GAME -->
  <div class="screen" id="screen-game">
    <div class="navRow">
      <button class="navPill" onclick="goHome()">🏠 <span id="navHomeTxt">Home</span></button>
      <button class="navPill" onclick="goRules()">📖 <span id="navRulesTxt">Rules</span></button>
    </div>
    <div class="gheader">
      <div class="turnBlock">
        <div class="turnLabel" id="turnLabel">TURN</div>
        <h2 class="turnName">🍺 <span id="turnBadge">—</span></h2>
      </div>
      <h2 class="modeTag" id="gameTitle">Mode</h2>
    </div>
    <div class="gbody" id="gameBody"></div>
  </div>

  <!-- RULES -->
  <div class="screen" id="screen-rules">
    <div class="navRow">
      <button class="navPill" onclick="goHome()">🏠 <span id="navHomeTxt2">Home</span></button>
    </div>
    <h2 id="rulesTitle" class="modeTag" style="margin-bottom:14px;">How to play</h2>
    <div class="accordion" id="rulesBody"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="loadOverlay" id="loadOverlay">
  <div class="loadIcon">🂡</div>
  <h1 class="loadHeadline" id="loadHeadline">KING OF HEARTS</h1>
  <p class="loadSub" id="loadSub">preparing…</p>
  <div class="loadBarTrack"><div class="loadBarFill"></div></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
