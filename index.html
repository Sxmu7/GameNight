<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>cardparty — card drinking games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="orb"></div>
<div class="grain"></div>

<div id="app">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="topbar">
      <div class="wordmark">
        <h1>card<span>party</span>.</h1>
        <p id="tagline">Minimal card drinking games</p>
      </div>
      <div class="langToggle">
        <button data-lang="de" onclick="setLang('de')">DE</button>
        <button data-lang="en" onclick="setLang('en')">EN</button>
      </div>
    </div>

    <div class="players">
      <div class="section-label" id="playersLabel">Players</div>
      <div class="chips" id="chipList"></div>
      <div class="addrow">
        <input id="playerInput" placeholder="Add a name…" maxlength="14">
        <button onclick="addPlayer()">+</button>
      </div>
    </div>

    <div class="section-label" id="gamesLabel">Games</div>
    <div class="modes" id="modeGrid"></div>

    <div class="rulesLink" onclick="goRules()">📖 <span id="rulesLinkTxt">How to play</span></div>
  </div>

  <!-- GAME -->
  <div class="screen" id="screen-game">
    <div class="gheader">
      <div class="back-btn" onclick="goHome()">←</div>
      <h2 id="gameTitle">Mode</h2>
      <div class="turn-badge"><span class="turn-dot"></span><span id="turnBadge">—</span></div>
    </div>
    <div class="gbody" id="gameBody"></div>
  </div>

  <!-- RULES -->
  <div class="screen" id="screen-rules">
    <div class="gheader">
      <div class="back-btn" onclick="goHome()">←</div>
      <h2 id="rulesTitle">How to play</h2>
    </div>
    <div class="accordion" id="rulesBody"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="loadOverlay" id="loadOverlay">
  <div class="loadDeck">
    <div class="loadCard"></div>
    <div class="loadCard"></div>
    <div class="loadCard"></div>
    <div class="loadCard"></div>
    <div class="loadCard"></div>
  </div>
  <div class="loadText" id="loadText">Shuffling the deck…</div>
  <div class="loadDots"><span></span><span></span><span></span></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
