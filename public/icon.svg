<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="248" fill="#000"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#D4AF37" stroke-width="10"/>

  <!-- Ace of spades (black) -->
  <g transform="translate(186,168) rotate(-13)">
    <rect x="-46" y="-64" width="92" height="130" rx="12" fill="#fff"/>
    <text x="-33" y="-32" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#111">A</text>
    <text x="-30" y="34" font-family="Arial" font-size="58" fill="#111">♠</text>
  </g>

  <!-- Ace of hearts (red) -->
  <g transform="translate(272,164) rotate(11)">
    <rect x="-46" y="-64" width="92" height="130" rx="12" fill="#fff"/>
    <text x="-33" y="-32" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#D42A2A">A</text>
    <text x="-31" y="36" font-family="Arial" font-size="58" fill="#D42A2A">♥</text>
  </g>

  <!-- Martini: solid gold, black outline -->
  <g transform="translate(226,318)">
    <path d="M -48 -36 L 48 -36 L 6 24 L 6 62 L 30 62 L 30 74 L -30 74 L -30 62 L -6 62 L -6 24 Z"
      fill="#D4AF37" stroke="#0A0A0A" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- Beer: solid gold body, black outline, white foam -->
  <g transform="translate(332,312)">
    <path d="M -32 -34 L 32 -34 L 27 64 L -27 64 Z" fill="#D4AF37" stroke="#0A0A0A" stroke-width="8" stroke-linejoin="round"/>
    <path d="M -30 -18 Q -4 2 -30 22" fill="none" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <path d="M -34 -34 Q 0 -50 34 -34 Q 34 -20 0 -22 Q -34 -20 -34 -34 Z" fill="#fff" stroke="#0A0A0A" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Dice -->
  <g transform="translate(150,340) rotate(-10)">
    <rect x="-26" y="-26" width="52" height="52" rx="10" fill="#0A0A0A" stroke="#D4AF37" stroke-width="5"/>
    <circle cx="-10" cy="-10" r="5" fill="#D4AF37"/>
    <circle cx="10" cy="-10" r="5" fill="#D4AF37"/>
    <circle cx="-10" cy="10" r="5" fill="#D4AF37"/>
    <circle cx="10" cy="10" r="5" fill="#D4AF37"/>
    <circle cx="0" cy="0" r="5" fill="#D4AF37"/>
  </g>

  <!-- Poker chip -->
  <g transform="translate(140,382)">
    <circle r="26" fill="#0A0A0A" stroke="#D4AF37" stroke-width="6"/>
    <circle r="16" fill="none" stroke="#D4AF37" stroke-width="4" stroke-dasharray="6 6"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="440" text-anchor="middle" font-family="Arial Black, Arial" font-size="52" font-weight="900" fill="#fff" letter-spacing="6">GAME</text>
  <text x="256" y="472" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#D4AF37" letter-spacing="10">— NIGHT —</text>
</svg>
